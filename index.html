<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Fatema Nusrat Jahan</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #18324a;
    }


    /* =========================
       NAVIGATION
    ========================= */

    .navbar {
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid #e5eaf0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1200px;
      margin: auto;
      padding: 18px 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 25px;
      font-weight: bold;
      color: #075c73;
    }

    #dynamicMenu {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
    }

    #dynamicMenu a {
      text-decoration: none;
      color: #18324a;
      font-weight: 600;
    }

    #dynamicMenu a:hover {
      color: #e76576;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 85vh;

      background:
        linear-gradient(
          135deg,
          #173e64,
          #008590
        );

      color: white;

      display: flex;
      align-items: center;
    }

    .hero-container {
      max-width: 1200px;
      width: 100%;

      margin: auto;
      padding: 80px 25px;

      display: grid;

      grid-template-columns:
        1.2fr .8fr;

      gap: 60px;

      align-items: center;
    }

    .small-title {
      font-size: 17px;
      letter-spacing: 6px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-family: Georgia, serif;
      font-size: 68px;
      font-weight: normal;
      line-height: 1.05;
    }

    .line {
      width: 140px;
      height: 7px;
      background: #ff7080;
      margin: 30px 0;
      border-radius: 20px;
    }

    .intro {
      max-width: 650px;

      font-size: 20px;
      line-height: 1.8;

      color: rgba(255,255,255,.9);

      white-space: pre-line;
    }


    /* =========================
       PROFILE
    ========================= */

    .profile-card {
      background: white;
      color: #18324a;

      padding: 40px;

      border-radius: 18px;

      text-align: center;

      box-shadow:
        0 25px 60px
        rgba(0,0,0,.18);
    }

    .profile-photo {
      width: 230px;
      height: 230px;

      border-radius: 50%;

      margin: 0 auto 25px;

      background: #e5eef1;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      color: #6c7d87;

      border: 7px solid #f7f9fc;
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-card h2 {
      font-family: Georgia, serif;
      color: #075c73;
      font-size: 30px;
    }


    /* =========================
       HOME UPLOADED FILES
    ========================= */

    #homeFilesSection {
      display: none;

      max-width: 1100px;

      margin: 35px auto 0;

      padding: 0 25px;
    }

    .home-files-box {
      background: white;

      padding: 35px;

      border-radius: 12px;

      box-shadow:
        0 10px 30px
        rgba(20,50,70,.08);
    }

    .home-files-box h2 {
      font-family: Georgia, serif;

      font-size: 32px;

      color: #075c73;

      margin-bottom: 20px;
    }


    /* =========================
       DYNAMIC PAGES
    ========================= */

    #dynamicContent {
      max-width: 1100px;

      margin: auto;

      padding: 0 25px 80px;
    }

    .dynamic-section {
      background: white;

      margin-top: 35px;

      padding: 45px;

      border-radius: 12px;

      box-shadow:
        0 10px 30px
        rgba(20,50,70,.08);

      scroll-margin-top: 100px;
    }

    .dynamic-section h2 {
      font-family: Georgia, serif;

      font-size: 38px;

      color: #075c73;

      margin-bottom: 20px;
    }

    .page-content {
      line-height: 1.8;

      color: #60717f;

      font-size: 18px;

      white-space: pre-line;
    }


    /* =========================
       MEDIA
    ========================= */

    .public-media {
      margin-top: 25px;

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(240px, 1fr)
        );

      gap: 20px;
    }

    .public-media-card {
      background: #f8fafc;

      border: 1px solid #e1e7ec;

      padding: 20px;

      border-radius: 12px;

      overflow: hidden;
    }

    .public-media-card img {
      width: 100%;

      max-height: 400px;

      object-fit: contain;

      display: block;

      background: white;

      border-radius: 9px;

      margin-bottom: 15px;
    }

    .public-media-card h3 {
      font-family: Georgia, serif;

      color: #075c73;

      font-size: 20px;

      margin-bottom: 8px;

      word-break: break-word;
    }

    .media-description {
      font-size: 15px;

      line-height: 1.6;

      color: #60717f;

      margin-bottom: 10px;
    }

    .media-size {
      font-size: 13px;

      color: #83929d;

      margin-top: 7px;
    }

    .file-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .file-button {
      display: inline-block;

      margin-top: 15px;

      padding: 11px 17px;

      background: #076b84;

      color: white;

      text-decoration: none;

      border-radius: 6px;

      font-weight: bold;
    }

    .file-button:hover {
      background: #07566a;
    }


    /* =========================
       MESSAGE
    ========================= */

    .load-error {
      background: #ffe8ea;

      color: #9a2833;

      padding: 15px;

      border-radius: 8px;

      margin-top: 20px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #103249;

      color: rgba(255,255,255,.85);

      text-align: center;

      padding: 25px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media(max-width: 800px) {

      .nav-container {
        flex-direction: column;
        gap: 15px;
      }

      #dynamicMenu {
        justify-content: center;
        gap: 18px;
      }

      .hero-container {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .line {
        margin-left: auto;
        margin-right: auto;
      }

      .hero h1 {
        font-size: 48px;
      }

      .profile-card {
        max-width: 420px;
        margin: auto;
      }

      .dynamic-section {
        padding: 28px 22px;
      }

      .dynamic-section h2 {
        font-size: 30px;
      }

      .home-files-box {
        padding: 25px 20px;
      }

    }

  </style>
</head>


<body>


<!-- =========================
     NAVIGATION
========================= -->

<nav class="navbar">

  <div class="nav-container">

    <div
      class="logo"
      id="siteLogo"
    >
      Fatema Nusrat Jahan
    </div>

    <div id="dynamicMenu"></div>

  </div>

</nav>



<!-- =========================
     HOME / HERO
========================= -->

<section
  class="hero"
  id="home"
>

  <div class="hero-container">


    <div>

      <div
        class="small-title"
        id="heroLabel"
      >
        PORTFOLIO OF
      </div>


      <h1 id="heroName">
        Fatema Nusrat Jahan
      </h1>


      <div class="line"></div>


      <p
        class="intro"
        id="introText"
      >
        Loading...
      </p>

    </div>



    <div class="profile-card">


      <div
        class="profile-photo"
        id="profilePhoto"
      >
        Profile Photo
      </div>


      <h2 id="profileName">
        Fatema Nusrat Jahan
      </h2>


    </div>

  </div>

</section>



<!-- =========================
     HOME FILES
========================= -->

<section id="homeFilesSection">

  <div class="home-files-box">

    <h2>Uploaded Files</h2>

    <div
      id="homeMedia"
      class="public-media"
    ></div>

  </div>

</section>



<!-- =========================
     OTHER PAGES
========================= -->

<main id="dynamicContent"></main>



<!-- =========================
     FOOTER
========================= -->

<footer id="footerText">

  © 2026 Fatema Nusrat Jahan

</footer>



<!-- =========================
     SUPABASE
========================= -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

  const SUPABASE_URL =
    "https://clyqhkpvhqeukgblklbu.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_MRdyQEcrzKMaeFnHJ5gKMg_4c8EGRAY";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );



  /* =====================================
     LOAD SITE SETTINGS
  ===================================== */

  async function loadSiteSettings() {

    const { data, error } =
      await supabaseClient.rpc(
        "get_public_site_settings"
      );


    if (error) {

      console.error(
        "Settings error:",
        error
      );

      return;
    }


    if (!data) {
      return;
    }


    const name =
      data.site_name ||
      "Fatema Nusrat Jahan";


    document.getElementById(
      "siteLogo"
    ).textContent =
      name;


    document.getElementById(
      "heroName"
    ).textContent =
      name;


    document.getElementById(
      "profileName"
    ).textContent =
      name;


    document.getElementById(
      "heroLabel"
    ).textContent =
      data.hero_label ||
      "PORTFOLIO OF";


    document.getElementById(
      "introText"
    ).textContent =
      data.intro_text ||
      "Welcome to my portfolio.";


    document.getElementById(
      "footerText"
    ).textContent =
      data.footer_text ||
      "© 2026 Fatema Nusrat Jahan";



    /* PROFILE PHOTO */

    const profile =
      document.getElementById(
        "profilePhoto"
      );


    if (
      data.profile_photo_base64 &&
      data.profile_photo_mime
    ) {

      const img =
        document.createElement(
          "img"
        );


      img.src =
        "data:" +
        data.profile_photo_mime +
        ";base64," +
        data.profile_photo_base64;


      profile.innerHTML =
        "";


      profile.appendChild(
        img
      );

    }

    else {

      profile.textContent =
        "Profile Photo";

    }

  }



  /* =====================================
     LOAD PAGES
  ===================================== */

  async function loadPages() {

    const { data, error } =
      await supabaseClient.rpc(
        "get_public_pages_v2"
      );


    console.log(
      "PAGE DATA:",
      data
    );


    console.log(
      "PAGE ERROR:",
      error
    );


    if (error) {

      document.getElementById(
        "dynamicContent"
      ).innerHTML =
        `
          <div class="load-error">
            Unable to load pages.
          </div>
        `;

      return;
    }


    let pages =
      data || [];


    /*
      If Supabase returns JSON
      as text, convert to array.
    */

    if (
      typeof pages === "string"
    ) {

      try {

        pages =
          JSON.parse(
            pages
          );

      }

      catch (err) {

        console.error(
          "JSON Parse Error:",
          err
        );

        pages = [];

      }

    }


    if (
      !Array.isArray(
        pages
      )
    ) {

      console.error(
        "Pages is not array:",
        pages
      );

      pages = [];

    }


    console.log(
      "FINAL PAGES:",
      pages
    );


    createMenu(
      pages
    );


    await createPages(
      pages
    );

  }



  /* =====================================
     CREATE MENU
  ===================================== */

  function createMenu(
    pages
  ) {

    const menu =
      document.getElementById(
        "dynamicMenu"
      );


    menu.innerHTML =
      "";


    pages
      .filter(
        page =>
          page.show_in_menu === true
      )
      .forEach(
        page => {


          const link =
            document.createElement(
              "a"
            );


          link.textContent =
            page.title;


          if (
            page.is_home
          ) {

            link.href =
              "#home";

          }

          else {

            link.href =
              "#" + page.slug;

          }


          menu.appendChild(
            link
          );

        }
      );

  }



  /* =====================================
     CREATE PAGES
  ===================================== */

  async function createPages(
    pages
  ) {

    const container =
      document.getElementById(
        "dynamicContent"
      );


    container.innerHTML =
      "";


    const homeFilesSection =
      document.getElementById(
        "homeFilesSection"
      );


    const homeMedia =
      document.getElementById(
        "homeMedia"
      );


    homeMedia.innerHTML =
      "";


    homeFilesSection.style.display =
      "none";


    for (
      const page of pages
    ) {


      /* =====================
         HOME PAGE
      ===================== */

      if (
        page.is_home === true
      ) {


        /*
          HOME TEXT
        */

        if (
          page.content &&
          page.content.trim() !== ""
        ) {

          document.getElementById(
            "introText"
          ).textContent =
            page.content;

        }


        /*
          HOME MEDIA

          THIS IS THE IMPORTANT FIX
        */

        const mediaCount =
          await loadPageMedia(
            page.id,
            homeMedia
          );


        if (
          mediaCount > 0
        ) {

          homeFilesSection.style.display =
            "block";

        }


        continue;

      }



      /* =====================
         NORMAL PAGE
      ===================== */

      const section =
        document.createElement(
          "section"
        );


      section.className =
        "dynamic-section";


      section.id =
        page.slug;



      /* TITLE */

      const heading =
        document.createElement(
          "h2"
        );


      heading.textContent =
        page.title;


      section.appendChild(
        heading
      );



      /* CONTENT */

      if (
        page.content &&
        page.content.trim() !== ""
      ) {

        const content =
          document.createElement(
            "p"
          );


        content.className =
          "page-content";


        content.textContent =
          page.content;


        section.appendChild(
          content
        );

      }



      /* MEDIA */

      const mediaContainer =
        document.createElement(
          "div"
        );


      mediaContainer.className =
        "public-media";


      section.appendChild(
        mediaContainer
      );


      container.appendChild(
        section
      );


      await loadPageMedia(
        page.id,
        mediaContainer
      );

    }

  }



  /* =====================================
     BASE64 → BLOB
  ===================================== */

  function base64ToBlobUrl(
    base64,
    mimeType
  ) {

    const binary =
      atob(
        base64
      );


    const bytes =
      new Uint8Array(
        binary.length
      );


    for (
      let i = 0;
      i < binary.length;
      i++
    ) {

      bytes[i] =
        binary.charCodeAt(
          i
        );

    }


    const blob =
      new Blob(
        [bytes],
        {
          type:
            mimeType ||
            "application/octet-stream"
        }
      );


    return URL.createObjectURL(
      blob
    );

  }



  /* =====================================
     FORMAT FILE SIZE
  ===================================== */

  function formatBytes(
    bytes
  ) {

    bytes =
      Number(bytes) || 0;


    if (
      bytes < 1024
    ) {

      return (
        bytes +
        " B"
      );

    }


    if (
      bytes <
      1024 * 1024
    ) {

      return (
        (
          bytes /
          1024
        ).toFixed(1) +
        " KB"
      );

    }


    return (
      (
        bytes /
        1024 /
        1024
      ).toFixed(1) +
      " MB"
    );

  }



  /* =====================================
     LOAD PAGE MEDIA
  ===================================== */

  async function loadPageMedia(
    pageId,
    container
  ) {

    const { data, error } =
      await supabaseClient.rpc(
        "get_public_media",
        {
          p_page_id:
            pageId
        }
      );


    console.log(
      "MEDIA FOR PAGE:",
      pageId,
      data
    );


    if (error) {

      console.error(
        "Media error:",
        error
      );


      container.innerHTML =
        "";


      return 0;

    }


    const media =
      data || [];


    if (
      media.length === 0
    ) {

      container.innerHTML =
        "";


      return 0;

    }


    container.innerHTML =
      "";


    let rendered =
      0;


    media.forEach(
      item => {


        if (
          !item.file_base64
        ) {

          return;

        }


        rendered++;


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "public-media-card";



        /*
          CREATE FILE URL
        */

        const fileUrl =
          base64ToBlobUrl(
            item.file_base64,
            item.mime_type
          );



        /* =====================
           IMAGE
        ===================== */

        if (
          item.mime_type &&
          item.mime_type.startsWith(
            "image/"
          )
        ) {

          const img =
            document.createElement(
              "img"
            );


          img.src =
            fileUrl;


          img.alt =
            item.title ||
            item.file_name;


          card.appendChild(
            img
          );

        }


        /* =====================
           DOCUMENT
        ===================== */

        else {

          const icon =
            document.createElement(
              "div"
            );


          icon.className =
            "file-icon";


          if (
            item.mime_type ===
            "application/pdf"
          ) {

            icon.textContent =
              "📄";

          }

          else if (
            item.mime_type ===
            "application/msword" ||

            item.mime_type ===
            "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
          ) {

            icon.textContent =
              "📝";

          }

          else {

            icon.textContent =
              "📁";

          }


          card.appendChild(
            icon
          );

        }



        /* =====================
           TITLE
        ===================== */

        const title =
          document.createElement(
            "h3"
          );


        title.textContent =
          item.title ||
          item.file_name;


        card.appendChild(
          title
        );



        /* =====================
           DESCRIPTION
        ===================== */

        if (
          item.description &&
          item.description.trim() !== ""
        ) {

          const description =
            document.createElement(
              "p"
            );


          description.className =
            "media-description";


          description.textContent =
            item.description;


          card.appendChild(
            description
          );

        }



        /* =====================
           FILE SIZE
        ===================== */

        if (
          item.file_size
        ) {

          const size =
            document.createElement(
              "div"
            );


          size.className =
            "media-size";


          size.textContent =
            "Size: " +
            formatBytes(
              item.file_size
            );


          card.appendChild(
            size
          );

        }



        /* =====================
           OPEN / DOWNLOAD
        ===================== */

        const link =
          document.createElement(
            "a"
          );


        link.className =
          "file-button";



        /*
          PDF
        */

        if (
          item.mime_type ===
          "application/pdf"
        ) {

          link.textContent =
            "Open PDF";


          link.href =
            fileUrl;


          link.target =
            "_blank";


          link.rel =
            "noopener";

        }



        /*
          IMAGE
        */

        else if (
          item.mime_type &&
          item.mime_type.startsWith(
            "image/"
          )
        ) {

          link.textContent =
            "Open Image";


          link.href =
            fileUrl;


          link.target =
            "_blank";


          link.rel =
            "noopener";

        }



        /*
          DOC / DOCX / TXT
        */

        else {

          link.textContent =
            "Download File";


          link.href =
            fileUrl;


          link.download =
            item.file_name;

        }


        card.appendChild(
          link
        );


        container.appendChild(
          card
        );

      }
    );


    return rendered;

  }



  /* =====================================
     START WEBSITE
  ===================================== */

  async function startWebsite() {

    await loadSiteSettings();

    await loadPages();

  }


  startWebsite();

</script>


</body>
</html>
