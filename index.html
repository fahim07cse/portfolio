<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fatema Nusrat Jahan</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #18324a;
    }

    /* NAVBAR */

    .navbar {
      background: rgba(255,255,255,0.97);
      border-bottom: 1px solid #e5eaf0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1200px;
      margin: auto;
      padding: 18px 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 25px;
      font-weight: bold;
      color: #075c73;
    }

    #dynamicMenu {
      display: flex;
      gap: 28px;
      align-items: center;
      flex-wrap: wrap;
    }

    #dynamicMenu a {
      text-decoration: none;
      color: #18324a;
      font-size: 16px;
      font-weight: 600;
      transition: .2s;
    }

    #dynamicMenu a:hover {
      color: #e76576;
    }


    /* HERO */

    .hero {
      min-height: 85vh;

      background: linear-gradient(
        135deg,
        #173e64,
        #008590
      );

      color: white;

      display: flex;
      align-items: center;
    }

    .hero-container {
      max-width: 1200px;
      width: 100%;
      margin: auto;
      padding: 80px 25px;

      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 60px;
      align-items: center;
    }

    .small-title {
      font-size: 17px;
      letter-spacing: 6px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-family: Georgia, serif;
      font-size: 68px;
      font-weight: normal;
      line-height: 1.05;
    }

    .line {
      width: 140px;
      height: 7px;
      background: #ff7080;
      margin: 30px 0;
      border-radius: 20px;
    }

    .intro {
      max-width: 650px;
      font-size: 20px;
      line-height: 1.8;
      color: rgba(255,255,255,.9);
      white-space: pre-line;
    }


    /* PROFILE CARD */

    .profile-card {
      background: white;
      color: #18324a;

      padding: 40px;
      border-radius: 18px;

      text-align: center;

      box-shadow:
        0 25px 60px
        rgba(0,0,0,.18);
    }

    .profile-photo {
      width: 210px;
      height: 210px;

      border-radius: 50%;

      margin: 0 auto 25px;

      background: #e5eef1;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #6c7d87;

      border: 7px solid #f7f9fc;
    }

    .profile-card h2 {
      font-family: Georgia, serif;
      color: #075c73;
      font-size: 30px;
    }


    /* DYNAMIC CONTENT */

    #dynamicContent {
      max-width: 1100px;
      margin: auto;
      padding: 35px 25px 80px;
    }

    .dynamic-section {
      background: white;

      margin-top: 35px;
      padding: 45px;

      border-radius: 12px;

      box-shadow:
        0 10px 30px
        rgba(20,50,70,.08);

      scroll-margin-top: 100px;
    }

    .dynamic-section h2 {
      font-family: Georgia, serif;
      font-size: 38px;
      color: #075c73;
      margin-bottom: 20px;
    }

    .dynamic-section p {
      line-height: 1.8;
      color: #60717f;
      font-size: 18px;
      white-space: pre-line;
    }


    /* STATUS */

    .status-message {
      max-width: 800px;
      margin: 30px auto;
      padding: 18px;
      text-align: center;
      color: #6b7885;
    }


    /* FOOTER */

    footer {
      background: #103249;
      color: rgba(255,255,255,.85);
      text-align: center;
      padding: 25px;
      font-size: 14px;
    }


    /* MOBILE */

    @media(max-width: 800px) {

      .nav-container {
        flex-direction: column;
        gap: 15px;
      }

      #dynamicMenu {
        justify-content: center;
        gap: 18px;
      }

      .hero-container {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .line {
        margin-left: auto;
        margin-right: auto;
      }

      .hero h1 {
        font-size: 48px;
      }

      .intro {
        margin: auto;
      }

      .profile-card {
        max-width: 420px;
        margin: auto;
      }
    }


    @media(max-width: 500px) {

      .hero h1 {
        font-size: 40px;
      }

      .small-title {
        font-size: 14px;
        letter-spacing: 4px;
      }

      .logo {
        font-size: 21px;
      }

      .dynamic-section {
        padding: 30px 22px;
      }

      .dynamic-section h2 {
        font-size: 32px;
      }

    }

  </style>
</head>


<body>

  <!-- NAVIGATION -->

  <nav class="navbar">

    <div class="nav-container">

      <div class="logo">
        Fatema Nusrat Jahan
      </div>

      <!-- MENU COMES FROM SUPABASE -->
      <div id="dynamicMenu"></div>

    </div>

  </nav>


  <!-- HOME HERO -->

  <section class="hero" id="home">

    <div class="hero-container">

      <div>

        <div class="small-title">
          PORTFOLIO OF
        </div>

        <h1>
          Fatema Nusrat Jahan
        </h1>

        <div class="line"></div>

        <!-- HOME CONTENT FROM DATABASE -->
        <p class="intro">
          Loading...
        </p>

      </div>


      <div class="profile-card">

        <div class="profile-photo">
          Profile Photo
        </div>

        <h2>
          Fatema Nusrat Jahan
        </h2>

      </div>

    </div>

  </section>


  <!-- DATABASE PAGES LOAD HERE -->

  <main id="dynamicContent">

    <div class="status-message" id="loadingMessage">
      Loading portfolio...
    </div>

  </main>


  <footer>
    © 2026 Fatema Nusrat Jahan
  </footer>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://clyqhkpvhqeukgblklbu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_MRdyQEcrzKMaeFnHJ5gKMg_4c8EGRAY";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =============================
       LOAD PAGES FROM DATABASE
    ============================= */

    async function loadPages() {

      const loadingMessage =
        document.getElementById(
          "loadingMessage"
        );


      const { data: pages, error } =
        await supabaseClient
          .from("pages")
          .select("*")
          .eq("visible", true)
          .order(
            "menu_order",
            { ascending: true }
          );


      if (error) {

        console.error(error);

        loadingMessage.innerHTML =
          "Unable to load portfolio.";

        return;
      }


      loadingMessage.remove();

      createMenu(pages);
      createPages(pages);

    }



    /* =============================
       CREATE NAVIGATION
    ============================= */

    function createMenu(pages) {

      const menu =
        document.getElementById(
          "dynamicMenu"
        );

      menu.innerHTML = "";


      const menuPages =
        pages.filter(
          page =>
            page.show_in_menu === true
        );


      menuPages.forEach(page => {

        const link =
          document.createElement("a");


        link.textContent =
          page.title;


        if (page.is_home) {

          link.href =
            "#home";

        } else {

          link.href =
            "#" + page.slug;

        }


        menu.appendChild(link);

      });

    }



    /* =============================
       CREATE WEBSITE CONTENT
    ============================= */

    function createPages(pages) {

      const container =
        document.getElementById(
          "dynamicContent"
        );


      pages.forEach(page => {


        /* HOME */

        if (page.is_home) {

          const intro =
            document.querySelector(
              ".intro"
            );


          if (page.content) {

            intro.textContent =
              page.content;

          } else {

            intro.textContent =
              "Welcome to my portfolio.";

          }


          return;
        }



        /* OTHER PAGES */

        const section =
          document.createElement(
            "section"
          );


        section.className =
          "dynamic-section";


        section.id =
          page.slug;



        const heading =
          document.createElement(
            "h2"
          );


        heading.textContent =
          page.title;



        const content =
          document.createElement(
            "p"
          );


        content.textContent =
          page.content || "";



        section.appendChild(
          heading
        );


        section.appendChild(
          content
        );


        container.appendChild(
          section
        );

      });

    }



    /* START */

    loadPages();

  </script>

</body>
</html>
