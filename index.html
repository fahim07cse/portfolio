<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fatema Nusrat Jahan</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #18324a;
    }

    /* NAVIGATION */

    .navbar {
      background: white;
      border-bottom: 1px solid #e5eaf0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1200px;
      margin: auto;
      padding: 18px 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 25px;
      font-weight: bold;
      color: #075c73;
    }

    #dynamicMenu {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    #dynamicMenu a {
      text-decoration: none;
      color: #18324a;
      font-size: 17px;
      font-weight: 600;
    }

    #dynamicMenu a:hover {
      color: #e76576;
    }

    /* HERO */

    .hero {
      min-height: 85vh;

      background: linear-gradient(
        135deg,
        #173e64,
        #008590
      );

      color: white;

      display: flex;
      align-items: center;
    }

    .hero-container {
      max-width: 1200px;
      width: 100%;
      margin: auto;
      padding: 80px 25px;

      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 60px;
      align-items: center;
    }

    .small-title {
      font-size: 17px;
      letter-spacing: 6px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-family: Georgia, serif;
      font-size: 68px;
      font-weight: normal;
      line-height: 1.05;
    }

    .line {
      width: 140px;
      height: 7px;
      background: #ff7080;
      margin: 30px 0;
      border-radius: 20px;
    }

    .intro {
      max-width: 650px;
      font-size: 20px;
      line-height: 1.8;
      color: rgba(255,255,255,.88);
    }

    /* PROFILE */

    .profile-card {
      background: white;
      color: #18324a;

      padding: 40px;
      border-radius: 18px;

      text-align: center;

      box-shadow:
        0 25px 60px
        rgba(0,0,0,.18);
    }

    .profile-photo {
      width: 210px;
      height: 210px;

      border-radius: 50%;

      margin: auto;
      margin-bottom: 25px;

      background: #e5eef1;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #6c7d87;
    }

    .profile-card h2 {
      font-family: Georgia, serif;
      color: #075c73;
      font-size: 30px;
    }

    /* DYNAMIC CONTENT */

    #dynamicContent {
      max-width: 1100px;
      margin: auto;
      padding: 30px 25px 80px;
    }

    .dynamic-section {
      background: white;

      margin-top: 35px;
      padding: 45px;

      border-radius: 12px;

      box-shadow:
        0 10px 30px
        rgba(20,50,70,.08);
    }

    .dynamic-section h2 {
      font-family: Georgia, serif;
      font-size: 38px;
      color: #075c73;
      margin-bottom: 20px;
    }

    .dynamic-section p {
      line-height: 1.8;
      color: #60717f;
      font-size: 18px;
    }

    footer {
      background: #103249;
      color: white;

      text-align: center;
      padding: 25px;

      font-size: 14px;
    }

    /* MOBILE */

    @media(max-width: 800px) {

      .hero-container {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .line {
        margin-left: auto;
        margin-right: auto;
      }

      .hero h1 {
        font-size: 48px;
      }

      .nav-container {
        flex-direction: column;
        gap: 15px;
      }

      #dynamicMenu {
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
      }

    }

  </style>
</head>


<body>

  <!-- NAVIGATION -->

  <nav class="navbar">

    <div class="nav-container">

      <div class="logo">
        Fatema Nusrat Jahan
      </div>

      <!--
        MENU WILL BE CREATED AUTOMATICALLY
        FROM DATABASE
      -->

      <div id="dynamicMenu"></div>

    </div>

  </nav>


  <!-- HOME -->

  <section class="hero" id="home">

    <div class="hero-container">

      <div>

        <div class="small-title">
          PORTFOLIO OF
        </div>

        <h1>
          Fatema Nusrat Jahan
        </h1>

        <div class="line"></div>

        <p class="intro">
          Welcome to my portfolio.
        </p>

      </div>


      <div class="profile-card">

        <div class="profile-photo">
          Profile Photo
        </div>

        <h2>
          Fatema Nusrat Jahan
        </h2>

      </div>

    </div>

  </section>


  <!--
    ADMIN CREATED CONTENT
    WILL LOAD HERE
  -->

  <main id="dynamicContent"></main>


  <footer>
    © 2026 Fatema Nusrat Jahan
  </footer>


  <script>

    /*
    =========================================
    TEMPORARY DATA
    =========================================

    Later this array will be replaced by:

    fetch("OUR BACKEND API")

    Admin Portal → Database → Website

    */

    const pages = [

      {
        title: "Home",
        slug: "home",
        showInMenu: true,
        visible: true,
        isHome: true
      }

    ];


    /* ==============================
       CREATE MENU AUTOMATICALLY
    ============================== */

    function createMenu() {

      const menu =
        document.getElementById("dynamicMenu");

      menu.innerHTML = "";


      const visiblePages =
        pages.filter(page =>
          page.visible &&
          page.showInMenu
        );


      visiblePages.forEach(page => {

        const link =
          document.createElement("a");


        if (page.isHome) {

          link.href = "#home";

        } else {

          link.href =
            "#" + page.slug;

        }


        link.textContent =
          page.title;


        menu.appendChild(link);

      });

    }


    /* ==============================
       CREATE PAGE CONTENT
    ============================== */

    function createPages() {

      const container =
        document.getElementById(
          "dynamicContent"
        );


      pages.forEach(page => {

        /*
        Home already has hero,
        so don't create another Home section.
        */

        if (
          page.isHome ||
          !page.visible
        ) {
          return;
        }


        const section =
          document.createElement("section");


        section.className =
          "dynamic-section";


        section.id =
          page.slug;


        section.innerHTML = `

          <h2>
            ${page.title}
          </h2>

          <p>
            ${page.content || ""}
          </p>

        `;


        container.appendChild(section);

      });

    }


    createMenu();
    createPages();

  </script>

</body>
</html>
