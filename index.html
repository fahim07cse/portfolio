<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Fatema Nusrat Jahan</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #18324a;
    }


    /* NAVIGATION */

    .navbar {
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid #e5eaf0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1200px;
      margin: auto;
      padding: 18px 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 25px;
      font-weight: bold;
      color: #075c73;
    }

    #dynamicMenu {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
    }

    #dynamicMenu a {
      text-decoration: none;
      color: #18324a;
      font-weight: 600;
    }

    #dynamicMenu a:hover {
      color: #e76576;
    }


    /* HERO */

    .hero {
      min-height: 85vh;

      background:
        linear-gradient(
          135deg,
          #173e64,
          #008590
        );

      color: white;

      display: flex;
      align-items: center;
    }

    .hero-container {
      max-width: 1200px;
      width: 100%;

      margin: auto;

      padding: 80px 25px;

      display: grid;

      grid-template-columns:
        1.2fr .8fr;

      gap: 60px;

      align-items: center;
    }

    .small-title {
      font-size: 17px;
      letter-spacing: 6px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-family: Georgia, serif;

      font-size: 68px;

      font-weight: normal;

      line-height: 1.05;
    }

    .line {
      width: 140px;
      height: 7px;

      background: #ff7080;

      margin: 30px 0;

      border-radius: 20px;
    }

    .intro {
      max-width: 650px;

      font-size: 20px;

      line-height: 1.8;

      color: rgba(255,255,255,.9);

      white-space: pre-line;
    }


    /* PROFILE */

    .profile-card {
      background: white;

      color: #18324a;

      padding: 40px;

      border-radius: 18px;

      text-align: center;

      box-shadow:
        0 25px 60px
        rgba(0,0,0,.18);
    }

    .profile-photo {
      width: 230px;
      height: 230px;

      border-radius: 50%;

      margin: 0 auto 25px;

      background: #e5eef1;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;

      color: #6c7d87;

      border: 7px solid #f7f9fc;
    }

    .profile-photo img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .profile-card h2 {
      font-family: Georgia, serif;

      color: #075c73;

      font-size: 30px;
    }


    /* DYNAMIC PAGES */

    #dynamicContent {
      max-width: 1100px;

      margin: auto;

      padding: 35px 25px 80px;
    }

    .dynamic-section {
      background: white;

      margin-top: 35px;

      padding: 45px;

      border-radius: 12px;

      box-shadow:
        0 10px 30px
        rgba(20,50,70,.08);

      scroll-margin-top: 100px;
    }

    .dynamic-section h2 {
      font-family: Georgia, serif;

      font-size: 38px;

      color: #075c73;

      margin-bottom: 20px;
    }

    .dynamic-section p {
      line-height: 1.8;

      color: #60717f;

      font-size: 18px;

      white-space: pre-line;
    }


    footer {
      background: #103249;

      color: rgba(255,255,255,.85);

      text-align: center;

      padding: 25px;
    }


    @media(max-width: 800px) {

      .nav-container {
        flex-direction: column;
        gap: 15px;
      }

      #dynamicMenu {
        justify-content: center;
        gap: 18px;
      }

      .hero-container {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .line {
        margin-left: auto;
        margin-right: auto;
      }

      .hero h1 {
        font-size: 48px;
      }

      .profile-card {
        max-width: 420px;
        margin: auto;
      }

    }

  </style>
</head>


<body>


<nav class="navbar">

  <div class="nav-container">

    <div
      class="logo"
      id="siteLogo"
    >
      Fatema Nusrat Jahan
    </div>

    <div id="dynamicMenu"></div>

  </div>

</nav>



<section
  class="hero"
  id="home"
>

  <div class="hero-container">


    <div>

      <div
        class="small-title"
        id="heroLabel"
      >
        PORTFOLIO OF
      </div>


      <h1 id="heroName">
        Fatema Nusrat Jahan
      </h1>


      <div class="line"></div>


      <p
        class="intro"
        id="introText"
      >
        Loading...
      </p>

    </div>



    <div class="profile-card">


      <div
        class="profile-photo"
        id="profilePhoto"
      >
        Profile Photo
      </div>


      <h2 id="profileName">
        Fatema Nusrat Jahan
      </h2>


    </div>

  </div>

</section>



<main id="dynamicContent"></main>



<footer id="footerText">
  © 2026 Fatema Nusrat Jahan
</footer>



<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

  const SUPABASE_URL =
    "https://clyqhkpvhqeukgblklbu.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_MRdyQEcrzKMaeFnHJ5gKMg_4c8EGRAY";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     LOAD SITE SETTINGS
  ========================= */

  async function loadSiteSettings() {

    const { data, error } =
      await supabaseClient.rpc(
        "get_public_site_settings"
      );


    if (error) {

      console.error(
        "Settings error:",
        error
      );

      return;

    }


    if (!data) {
      return;
    }


    const name =
      data.site_name ||
      "Fatema Nusrat Jahan";


    document
      .getElementById(
        "siteLogo"
      )
      .textContent =
      name;


    document
      .getElementById(
        "heroName"
      )
      .textContent =
      name;


    document
      .getElementById(
        "profileName"
      )
      .textContent =
      name;


    document
      .getElementById(
        "heroLabel"
      )
      .textContent =
      data.hero_label ||
      "PORTFOLIO OF";


    document
      .getElementById(
        "introText"
      )
      .textContent =
      data.intro_text ||
      "Welcome to my portfolio.";


    document
      .getElementById(
        "footerText"
      )
      .textContent =
      data.footer_text ||
      "© 2026 Fatema Nusrat Jahan";


    /* PROFILE PICTURE */

    const profile =
      document.getElementById(
        "profilePhoto"
      );


    if (
      data.profile_photo_base64 &&
      data.profile_photo_mime
    ) {

      const img =
        document.createElement(
          "img"
        );


      img.src =
        "data:" +
        data.profile_photo_mime +
        ";base64," +
        data.profile_photo_base64;


      profile.innerHTML = "";

      profile.appendChild(
        img
      );

    }

    else {

      profile.textContent =
        "Profile Photo";

    }

  }



  /* =========================
     LOAD PAGES
  ========================= */

  async function loadPages() {

    const { data: pages, error } =
      await supabaseClient
        .from("pages")
        .select("*")
        .eq(
          "visible",
          true
        )
        .order(
          "menu_order",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        "Pages error:",
        error
      );

      return;

    }


    createMenu(
      pages || []
    );


    createPages(
      pages || []
    );

  }



  /* =========================
     MENU
  ========================= */

  function createMenu(
    pages
  ) {

    const menu =
      document.getElementById(
        "dynamicMenu"
      );


    menu.innerHTML = "";


    pages
      .filter(
        page =>
          page.show_in_menu
      )
      .forEach(
        page => {

          const link =
            document.createElement(
              "a"
            );


          link.textContent =
            page.title;


          link.href =
            page.is_home
              ? "#home"
              : "#" + page.slug;


          menu.appendChild(
            link
          );

        }
      );

  }



  /* =========================
     DYNAMIC CONTENT
  ========================= */

  function createPages(
    pages
  ) {

    const container =
      document.getElementById(
        "dynamicContent"
      );


    container.innerHTML = "";


    pages.forEach(
      page => {


        if (page.is_home) {

          return;

        }


        const section =
          document.createElement(
            "section"
          );


        section.className =
          "dynamic-section";


        section.id =
          page.slug;



        const heading =
          document.createElement(
            "h2"
          );


        heading.textContent =
          page.title;



        const content =
          document.createElement(
            "p"
          );


        content.textContent =
          page.content || "";


        section.appendChild(
          heading
        );


        section.appendChild(
          content
        );


        container.appendChild(
          section
        );

      }
    );

  }



  /* =========================
     START
  ========================= */

  async function startWebsite() {

    await Promise.all([
      loadSiteSettings(),
      loadPages()
    ]);

  }


  startWebsite();

</script>


</body>
</html>
