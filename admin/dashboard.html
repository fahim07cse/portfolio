<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Fatema Nusrat Jahan</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f9;
      color: #17324a;
    }

    .topbar {
      background: linear-gradient(135deg, #173e64, #008590);
      color: white;
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar h1 {
      font-family: Georgia, serif;
      font-size: 30px;
      font-weight: 400;
    }

    .logout-btn {
      border: 1px solid rgba(255,255,255,.6);
      background: transparent;
      color: white;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .layout {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 25px;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(20,50,70,.08);
    }

    .panel h2 {
      margin-bottom: 20px;
      color: #075c73;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5dd;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      gap: 18px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .checkbox-row label {
      margin: 0;
      font-weight: 500;
    }

    .checkbox-row input {
      width: auto;
      margin-right: 6px;
    }

    .save-btn {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #076b84;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .save-btn:hover {
      background: #05596e;
    }

    .page-item {
      border: 1px solid #e1e7ec;
      border-radius: 9px;
      padding: 18px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
    }

    .page-info h3 {
      margin-bottom: 6px;
      color: #173e64;
    }

    .page-info small {
      color: #7b8995;
    }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      margin-top: 8px;
      margin-right: 5px;
      border-radius: 20px;
      font-size: 12px;
      background: #eef3f6;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .actions button {
      border: none;
      padding: 8px 11px;
      border-radius: 5px;
      cursor: pointer;
    }

    .edit {
      background: #e8f4f7;
      color: #08657a;
    }

    .toggle {
      background: #fff2cc;
      color: #755c00;
    }

    .delete {
      background: #ffe3e5;
      color: #a52b38;
    }

    .move {
      background: #edf0f4;
      color: #435363;
    }

    .empty {
      color: #7c8995;
      text-align: center;
      padding: 40px 10px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .reset-btn {
      background: #edf0f4;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }

      .page-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <h1>Fatema Nusrat Jahan — Admin Dashboard</h1>
    <button class="logout-btn" onclick="logout()">Log Out</button>
  </div>

  <div class="layout">

    <div class="panel">
      <h2 id="formTitle">Add New Page</h2>

      <form id="pageForm">

        <input type="hidden" id="editIndex">

        <label>Page Title</label>
        <input
          type="text"
          id="title"
          placeholder="Example: Education"
          required
        >

        <label>Page Slug</label>
        <input
          type="text"
          id="slug"
          placeholder="Example: education"
          required
        >

        <label>Content</label>
        <textarea
          id="content"
          placeholder="Write page content here..."
        ></textarea>

        <label>Menu Order</label>
        <input
          type="number"
          id="order"
          value="1"
          min="1"
        >

        <div class="checkbox-row">

          <label>
            <input type="checkbox" id="visible" checked>
            Visible
          </label>

          <label>
            <input type="checkbox" id="showInMenu" checked>
            Show in Menu
          </label>

        </div>

        <button type="submit" class="save-btn">
          Save Page
        </button>

        <button
          type="button"
          class="save-btn"
          id="cancelEdit"
          style="display:none;background:#6b7783;"
          onclick="resetForm()"
        >
          Cancel Edit
        </button>

      </form>
    </div>


    <div class="panel">

      <div class="section-title">
        <h2>Manage Pages</h2>

        <button class="reset-btn" onclick="renderPages()">
          Refresh
        </button>
      </div>

      <div id="pageList"></div>

    </div>

  </div>


  <script>
    const STORAGE_KEY = "fatemaPortfolioPages";

    let pages = JSON.parse(
      localStorage.getItem(STORAGE_KEY)
    ) || [
      {
        title: "Home",
        slug: "home",
        content: "",
        visible: true,
        showInMenu: true,
        order: 1,
        isHome: true
      }
    ];


    function savePages() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(pages)
      );
    }


    function renderPages() {

      const pageList =
        document.getElementById("pageList");

      pageList.innerHTML = "";

      pages.sort((a, b) => a.order - b.order);

      if (pages.length === 0) {
        pageList.innerHTML =
          '<div class="empty">No pages available.</div>';
        return;
      }

      pages.forEach((page, index) => {

        const item =
          document.createElement("div");

        item.className = "page-item";

        item.innerHTML = `
          <div class="page-info">

            <h3>${page.title}</h3>

            <small>
              /${page.slug}
            </small>

            <br>

            <span class="badge">
              ${page.visible ? "Visible" : "Hidden"}
            </span>

            <span class="badge">
              ${page.showInMenu ? "In Menu" : "Not in Menu"}
            </span>

            <span class="badge">
              Order: ${page.order}
            </span>

          </div>

          <div class="actions">

            <button
              class="move"
              onclick="moveUp(${index})"
            >
              ↑
            </button>

            <button
              class="move"
              onclick="moveDown(${index})"
            >
              ↓
            </button>

            <button
              class="edit"
              onclick="editPage(${index})"
            >
              Edit
            </button>

            ${
              !page.isHome
              ? `
                <button
                  class="toggle"
                  onclick="toggleVisibility(${index})"
                >
                  ${page.visible ? "Hide" : "Show"}
                </button>

                <button
                  class="delete"
                  onclick="deletePage(${index})"
                >
                  Delete
                </button>
              `
              : ""
            }

          </div>
        `;

        pageList.appendChild(item);

      });

    }


    document
      .getElementById("pageForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const editIndex =
          document.getElementById("editIndex").value;

        const title =
          document.getElementById("title").value.trim();

        const slug =
          document
            .getElementById("slug")
            .value
            .trim()
            .toLowerCase()
            .replace(/\s+/g, "-");

        const content =
          document.getElementById("content").value;

        const order =
          Number(
            document.getElementById("order").value
          );

        const visible =
          document.getElementById("visible").checked;

        const showInMenu =
          document.getElementById("showInMenu").checked;


        if (editIndex === "") {

          pages.push({
            title,
            slug,
            content,
            order,
            visible,
            showInMenu,
            isHome: false
          });

        } else {

          const currentPage =
            pages[Number(editIndex)];

          pages[Number(editIndex)] = {
            ...currentPage,
            title,
            slug,
            content,
            order,
            visible,
            showInMenu
          };

        }

        savePages();
        resetForm();
        renderPages();

      });


    function editPage(index) {

      const page = pages[index];

      document.getElementById("editIndex").value =
        index;

      document.getElementById("title").value =
        page.title;

      document.getElementById("slug").value =
        page.slug;

      document.getElementById("content").value =
        page.content || "";

      document.getElementById("order").value =
        page.order;

      document.getElementById("visible").checked =
        page.visible;

      document.getElementById("showInMenu").checked =
        page.showInMenu;

      document.getElementById("formTitle").textContent =
        "Edit Page";

      document.getElementById("cancelEdit").style.display =
        "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function toggleVisibility(index) {

      pages[index].visible =
        !pages[index].visible;

      savePages();
      renderPages();

    }


    function deletePage(index) {

      if (pages[index].isHome) {
        alert("Home page cannot be deleted.");
        return;
      }

      const confirmed =
        confirm(
          "Are you sure you want to delete this page?"
        );

      if (!confirmed) {
        return;
      }

      pages.splice(index, 1);

      savePages();
      renderPages();

    }


    function moveUp(index) {

      if (index === 0) return;

      const previous =
        pages[index - 1];

      const current =
        pages[index];

      const temp =
        previous.order;

      previous.order =
        current.order;

      current.order =
        temp;

      savePages();
      renderPages();

    }


    function moveDown(index) {

      if (index === pages.length - 1) return;

      const next =
        pages[index + 1];

      const current =
        pages[index];

      const temp =
        next.order;

      next.order =
        current.order;

      current.order =
        temp;

      savePages();
      renderPages();

    }


    function resetForm() {

      document
        .getElementById("pageForm")
        .reset();

      document.getElementById("editIndex").value =
        "";

      document.getElementById("visible").checked =
        true;

      document.getElementById("showInMenu").checked =
        true;

      document.getElementById("order").value =
        pages.length + 1;

      document.getElementById("formTitle").textContent =
        "Add New Page";

      document.getElementById("cancelEdit").style.display =
        "none";

    }


    function logout() {
      window.location.href = "index.html";
    }


    renderPages();
    resetForm();

  </script>

</body>
</html>
