<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | Fatema Nusrat Jahan</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f9;
      color: #17324a;
    }

    .topbar {
      background: linear-gradient(135deg, #173e64, #008590);
      color: white;
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar h1 {
      font-family: Georgia, serif;
      font-size: 30px;
      font-weight: 400;
    }

    .logout-btn {
      border: 1px solid rgba(255,255,255,.6);
      background: transparent;
      color: white;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .layout {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 25px;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(20,50,70,.08);
    }

    .panel h2 {
      margin-bottom: 20px;
      color: #075c73;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5dd;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      gap: 18px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .checkbox-row label {
      margin: 0;
      font-weight: 500;
    }

    .checkbox-row input {
      width: auto;
      margin-right: 6px;
    }

    .save-btn {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #076b84;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .cancel-btn {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #6b7783;
      color: white;
      cursor: pointer;
      display: none;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      font-size: 14px;
    }

    .success {
      background: #e8f7ef;
      color: #17633b;
    }

    .error {
      background: #ffe8ea;
      color: #9a2833;
    }

    .page-item {
      border: 1px solid #e1e7ec;
      border-radius: 9px;
      padding: 18px;
      margin-bottom: 15px;

      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
    }

    .page-info h3 {
      margin-bottom: 6px;
      color: #173e64;
    }

    .page-info small {
      color: #7b8995;
    }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      margin-top: 8px;
      margin-right: 5px;
      border-radius: 20px;
      font-size: 12px;
      background: #eef3f6;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .actions button {
      border: none;
      padding: 8px 11px;
      border-radius: 5px;
      cursor: pointer;
    }

    .edit {
      background: #e8f4f7;
      color: #08657a;
    }

    .toggle {
      background: #fff2cc;
      color: #755c00;
    }

    .delete {
      background: #ffe3e5;
      color: #a52b38;
    }

    .menu-toggle {
      background: #ece8ff;
      color: #5743a6;
    }

    .empty {
      color: #7c8995;
      text-align: center;
      padding: 40px 10px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #70808d;
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }

      .page-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <h1>Fatema Nusrat Jahan — Admin Dashboard</h1>

    <button class="logout-btn" onclick="logout()">
      Log Out
    </button>
  </div>


  <div class="layout">

    <!-- ADD / EDIT FORM -->

    <div class="panel">

      <h2 id="formTitle">
        Add New Page
      </h2>

      <form id="pageForm">

        <input type="hidden" id="editId">


        <label>Page Title</label>

        <input
          type="text"
          id="title"
          placeholder="Example: Education"
          required
        >


        <label>Page Slug</label>

        <input
          type="text"
          id="slug"
          placeholder="Example: education"
          required
        >


        <label>Content</label>

        <textarea
          id="content"
          placeholder="Write page content here..."
        ></textarea>


        <label>Menu Order</label>

        <input
          type="number"
          id="menuOrder"
          min="1"
          value="2"
          required
        >


        <div class="checkbox-row">

          <label>
            <input
              type="checkbox"
              id="visible"
              checked
            >
            Visible
          </label>


          <label>
            <input
              type="checkbox"
              id="showInMenu"
              checked
            >
            Show in Menu
          </label>

        </div>


        <button
          type="submit"
          class="save-btn"
          id="saveButton"
        >
          Save Page
        </button>


        <button
          type="button"
          class="cancel-btn"
          id="cancelButton"
          onclick="resetForm()"
        >
          Cancel Edit
        </button>


        <div
          id="message"
          class="message"
        ></div>

      </form>

    </div>


    <!-- PAGE LIST -->

    <div class="panel">

      <h2>
        Manage Pages
      </h2>

      <div id="pageList">
        <div class="loading">
          Loading pages...
        </div>
      </div>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://clyqhkpvhqeukgblklbu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_MRdyQEcrzKMaeFnHJ5gKMg_4c8EGRAY";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let pages = [];


    /* ===========================
       LOAD PAGES
    =========================== */

    async function loadPages() {

      const pageList =
        document.getElementById("pageList");


      pageList.innerHTML =
        '<div class="loading">Loading pages...</div>';


      const { data, error } =
        await supabaseClient
          .from("pages")
          .select("*")
          .order(
            "menu_order",
            { ascending: true }
          );


      if (error) {

        console.error(error);

        pageList.innerHTML =
          '<div class="empty">Unable to load pages.</div>';

        showMessage(
          error.message,
          "error"
        );

        return;
      }


      pages = data || [];

      renderPages();

    }



    /* ===========================
       RENDER PAGES
    =========================== */

    function renderPages() {

      const pageList =
        document.getElementById("pageList");


      pageList.innerHTML = "";


      if (pages.length === 0) {

        pageList.innerHTML =
          '<div class="empty">No pages found.</div>';

        return;
      }


      pages.forEach(page => {

        const item =
          document.createElement("div");


        item.className =
          "page-item";


        const left =
          document.createElement("div");


        left.className =
          "page-info";


        const title =
          document.createElement("h3");


        title.textContent =
          page.title;


        const slug =
          document.createElement("small");


        slug.textContent =
          "/" + page.slug;


        left.appendChild(title);
        left.appendChild(slug);


        left.appendChild(
          createBadge(
            page.visible
              ? "Visible"
              : "Hidden"
          )
        );


        left.appendChild(
          createBadge(
            page.show_in_menu
              ? "In Menu"
              : "Not in Menu"
          )
        );


        left.appendChild(
          createBadge(
            "Order: " + page.menu_order
          )
        );


        if (page.is_home) {

          left.appendChild(
            createBadge("Home")
          );

        }


        const actions =
          document.createElement("div");


        actions.className =
          "actions";


        const editButton =
          createButton(
            "Edit",
            "edit",
            () => editPage(page.id)
          );


        actions.appendChild(
          editButton
        );


        const visibilityButton =
          createButton(
            page.visible
              ? "Hide"
              : "Show",
            "toggle",
            () =>
              toggleVisibility(page)
          );


        actions.appendChild(
          visibilityButton
        );


        const menuButton =
          createButton(
            page.show_in_menu
              ? "Remove Menu"
              : "Add Menu",
            "menu-toggle",
            () =>
              toggleMenu(page)
          );


        actions.appendChild(
          menuButton
        );


        if (!page.is_home) {

          const deleteButton =
            createButton(
              "Delete",
              "delete",
              () =>
                deletePage(page)
            );


          actions.appendChild(
            deleteButton
          );

        }


        item.appendChild(left);
        item.appendChild(actions);

        pageList.appendChild(item);

      });

    }



    function createBadge(text) {

      const badge =
        document.createElement("span");

      badge.className =
        "badge";

      badge.textContent =
        text;

      return badge;

    }



    function createButton(
      text,
      className,
      callback
    ) {

      const button =
        document.createElement("button");

      button.textContent =
        text;

      button.className =
        className;

      button.onclick =
        callback;

      return button;

    }



    /* ===========================
       SAVE PAGE
    =========================== */

    document
      .getElementById("pageForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const editId =
            document
              .getElementById("editId")
              .value;


          const title =
            document
              .getElementById("title")
              .value
              .trim();


          const slug =
            document
              .getElementById("slug")
              .value
              .trim()
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-|-$/g, "");


          const content =
            document
              .getElementById("content")
              .value;


          const menuOrder =
            Number(
              document
                .getElementById("menuOrder")
                .value
            );


          const visible =
            document
              .getElementById("visible")
              .checked;


          const showInMenu =
            document
              .getElementById("showInMenu")
              .checked;


          if (!slug) {

            showMessage(
              "Please enter a valid slug.",
              "error"
            );

            return;
          }


          const saveButton =
            document.getElementById(
              "saveButton"
            );


          saveButton.disabled = true;
          saveButton.textContent =
            "Saving...";


          let result;


          /* NEW PAGE */

          if (!editId) {

            result =
              await supabaseClient
                .from("pages")
                .insert({
                  title: title,
                  slug: slug,
                  content: content,
                  visible: visible,
                  show_in_menu:
                    showInMenu,
                  menu_order:
                    menuOrder,
                  is_home: false
                });

          }


          /* EDIT PAGE */

          else {

            result =
              await supabaseClient
                .from("pages")
                .update({
                  title: title,
                  slug: slug,
                  content: content,
                  visible: visible,
                  show_in_menu:
                    showInMenu,
                  menu_order:
                    menuOrder
                })
                .eq(
                  "id",
                  editId
                );

          }


          saveButton.disabled = false;
          saveButton.textContent =
            "Save Page";


          if (result.error) {

            console.error(
              result.error
            );


            showMessage(
              result.error.message,
              "error"
            );

            return;
          }


          showMessage(
            editId
              ? "Page updated successfully."
              : "Page added successfully.",
            "success"
          );


          resetForm();

          await loadPages();

        }
      );



    /* ===========================
       EDIT
    =========================== */

    function editPage(id) {

      const page =
        pages.find(
          item =>
            item.id === id
        );


      if (!page) return;


      document
        .getElementById("editId")
        .value =
        page.id;


      document
        .getElementById("title")
        .value =
        page.title;


      document
        .getElementById("slug")
        .value =
        page.slug;


      document
        .getElementById("content")
        .value =
        page.content || "";


      document
        .getElementById("menuOrder")
        .value =
        page.menu_order;


      document
        .getElementById("visible")
        .checked =
        page.visible;


      document
        .getElementById("showInMenu")
        .checked =
        page.show_in_menu;


      document
        .getElementById("formTitle")
        .textContent =
        "Edit Page";


      document
        .getElementById("cancelButton")
        .style.display =
        "block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }



    /* ===========================
       SHOW / HIDE
    =========================== */

    async function toggleVisibility(page) {

      const { error } =
        await supabaseClient
          .from("pages")
          .update({
            visible:
              !page.visible
          })
          .eq(
            "id",
            page.id
          );


      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }


      await loadPages();

    }



    /* ===========================
       MENU ON / OFF
    =========================== */

    async function toggleMenu(page) {

      const { error } =
        await supabaseClient
          .from("pages")
          .update({
            show_in_menu:
              !page.show_in_menu
          })
          .eq(
            "id",
            page.id
          );


      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }


      await loadPages();

    }



    /* ===========================
       DELETE
    =========================== */

    async function deletePage(page) {

      if (page.is_home) {

        alert(
          "Home page cannot be deleted."
        );

        return;
      }


      const confirmed =
        confirm(
          'Delete "' +
          page.title +
          '"?'
        );


      if (!confirmed) return;


      const { error } =
        await supabaseClient
          .from("pages")
          .delete()
          .eq(
            "id",
            page.id
          );


      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }


      showMessage(
        "Page deleted successfully.",
        "success"
      );


      await loadPages();

    }



    /* ===========================
       RESET FORM
    =========================== */

    function resetForm() {

      document
        .getElementById("pageForm")
        .reset();


      document
        .getElementById("editId")
        .value = "";


      document
        .getElementById("formTitle")
        .textContent =
        "Add New Page";


      document
        .getElementById("visible")
        .checked =
        true;


      document
        .getElementById("showInMenu")
        .checked =
        true;


      document
        .getElementById("menuOrder")
        .value =
        pages.length + 1;


      document
        .getElementById("cancelButton")
        .style.display =
        "none";

    }



    /* ===========================
       MESSAGE
    =========================== */

    function showMessage(
      text,
      type
    ) {

      const message =
        document.getElementById(
          "message"
        );


      message.textContent =
        text;


      message.className =
        "message " + type;


      message.style.display =
        "block";


      setTimeout(() => {

        message.style.display =
          "none";

      }, 5000);

    }



    /* ===========================
       LOGOUT
    =========================== */

    function logout() {

      window.location.href =
        "index.html";

    }



    /* START */

    loadPages();

  </script>

</body>
</html>
