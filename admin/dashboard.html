<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Admin Dashboard | Fatema Nusrat Jahan
  </title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f9;
      color: #17324a;
    }


    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      background:
        linear-gradient(
          135deg,
          #173e64,
          #008590
        );

      color: white;

      padding: 20px 28px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;
    }

    .brand h1 {
      font-family: Georgia, serif;
      font-size: 28px;
      font-weight: normal;
    }

    .brand p {
      margin-top: 5px;
      font-size: 13px;
      opacity: .8;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .username {
      font-size: 14px;
    }

    .logout-btn {
      border: 1px solid rgba(255,255,255,.6);
      background: transparent;
      color: white;

      padding: 10px 16px;

      border-radius: 6px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,.1);
    }


    /* =========================
       LAYOUT
    ========================= */

    .layout {
      max-width: 1250px;

      margin: 35px auto;

      padding: 0 20px 60px;

      display: grid;

      grid-template-columns:
        350px 1fr;

      gap: 25px;
    }

    .panel {
      background: white;

      border-radius: 12px;

      padding: 25px;

      box-shadow:
        0 10px 30px
        rgba(20,50,70,.08);
    }

    .panel h2 {
      color: #075c73;

      font-family: Georgia, serif;

      font-size: 26px;

      margin-bottom: 20px;
    }


    /* =========================
       FORM
    ========================= */

    label {
      display: block;

      margin-top: 15px;
      margin-bottom: 7px;

      font-weight: 700;
    }

    input,
    textarea {

      width: 100%;

      padding: 12px;

      border: 1px solid #ccd5dd;

      border-radius: 6px;

      font-size: 15px;

      outline: none;
    }

    input:focus,
    textarea:focus {

      border-color: #078095;

      box-shadow:
        0 0 0 3px
        rgba(0,128,149,.08);
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    .checkbox-row {

      display: flex;

      gap: 18px;

      margin-top: 20px;

      flex-wrap: wrap;
    }

    .checkbox-row label {

      margin: 0;

      font-weight: normal;

      display: flex;

      align-items: center;

      gap: 6px;
    }

    .checkbox-row input {
      width: auto;
    }

    .save-btn {

      width: 100%;

      margin-top: 23px;

      padding: 13px;

      border: none;

      border-radius: 6px;

      background:
        linear-gradient(
          135deg,
          #075c73,
          #008995
        );

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    .save-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .cancel-btn {

      display: none;

      width: 100%;

      margin-top: 10px;

      padding: 12px;

      border: none;

      border-radius: 6px;

      background: #6d7883;

      color: white;

      cursor: pointer;
    }


    /* =========================
       MESSAGE
    ========================= */

    .message {

      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 6px;

      font-size: 14px;
    }

    .message.success {

      display: block;

      background: #e7f7ee;

      color: #17623b;
    }

    .message.error {

      display: block;

      background: #ffe6e8;

      color: #9c2b38;
    }


    /* =========================
       PAGE LIST
    ========================= */

    .page-item {

      border:
        1px solid #e1e7ec;

      border-radius: 10px;

      padding: 18px;

      margin-bottom: 15px;

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 20px;
    }

    .page-info {
      flex: 1;
    }

    .page-info h3 {

      color: #173e64;

      font-size: 20px;

      margin-bottom: 6px;
    }

    .slug {

      color: #778793;

      font-size: 13px;
    }

    .preview {

      margin-top: 10px;

      color: #657582;

      font-size: 14px;

      line-height: 1.5;

      max-width: 550px;
    }


    /* =========================
       BADGES
    ========================= */

    .badges {
      margin-top: 10px;
    }

    .badge {

      display: inline-block;

      margin-right: 5px;
      margin-bottom: 5px;

      padding: 5px 9px;

      border-radius: 20px;

      background: #eef3f6;

      font-size: 12px;
    }

    .badge.home {
      background: #e6f3ff;
      color: #176098;
    }

    .badge.hidden {
      background: #fff0d5;
      color: #8a6200;
    }


    /* =========================
       ACTION BUTTONS
    ========================= */

    .actions {

      display: flex;

      justify-content:
        flex-end;

      gap: 7px;

      flex-wrap: wrap;

      max-width: 300px;
    }

    .actions button {

      border: none;

      padding: 8px 11px;

      border-radius: 5px;

      cursor: pointer;

      font-size: 13px;
    }

    .edit-btn {
      background: #e4f3f7;
      color: #08657a;
    }

    .visibility-btn {
      background: #fff1c9;
      color: #745800;
    }

    .menu-btn {
      background: #ede9ff;
      color: #57439e;
    }

    .delete-btn {
      background: #ffe3e5;
      color: #a62c38;
    }


    /* =========================
       EMPTY / LOADING
    ========================= */

    .loading,
    .empty {

      text-align: center;

      padding: 45px 10px;

      color: #71818d;
    }


    /* =========================
       MOBILE
    ========================= */

    @media(max-width: 900px) {

      .layout {
        grid-template-columns: 1fr;
      }

    }

    @media(max-width: 650px) {

      .topbar {

        flex-direction: column;

        align-items: flex-start;
      }

      .top-actions {

        width: 100%;

        justify-content:
          space-between;
      }

      .page-item {

        flex-direction: column;

        align-items: flex-start;
      }

      .actions {

        justify-content:
          flex-start;

        max-width: none;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       TOP BAR
  ========================== -->

  <header class="topbar">

    <div class="brand">

      <h1>
        Fatema Nusrat Jahan
      </h1>

      <p>
        Admin Dashboard
      </p>

    </div>


    <div class="top-actions">

      <div
        class="username"
        id="currentUser"
      >
        Checking login...
      </div>

      <button
        class="logout-btn"
        onclick="logout()"
      >
        Log Out
      </button>

    </div>

  </header>



  <!-- =========================
       MAIN
  ========================== -->

  <main class="layout">


    <!-- ADD / EDIT -->

    <section class="panel">

      <h2 id="formTitle">
        Add New Page
      </h2>


      <form id="pageForm">


        <input
          type="hidden"
          id="editId"
        >


        <label for="title">
          Page Title
        </label>

        <input
          type="text"
          id="title"
          placeholder="Example: Education"
          required
        >


        <label for="slug">
          Page Slug
        </label>

        <input
          type="text"
          id="slug"
          placeholder="Example: education"
          required
        >


        <label for="content">
          Content
        </label>

        <textarea
          id="content"
          placeholder="Write the page content here..."
        ></textarea>


        <label for="menuOrder">
          Menu Order
        </label>

        <input
          type="number"
          id="menuOrder"
          min="1"
          value="2"
          required
        >


        <div class="checkbox-row">

          <label>

            <input
              type="checkbox"
              id="visible"
              checked
            >

            Visible

          </label>


          <label>

            <input
              type="checkbox"
              id="showInMenu"
              checked
            >

            Show in Menu

          </label>

        </div>


        <button
          type="submit"
          class="save-btn"
          id="saveButton"
        >
          Save Page
        </button>


        <button
          type="button"
          class="cancel-btn"
          id="cancelButton"
          onclick="resetForm()"
        >
          Cancel Edit
        </button>


        <div
          id="message"
          class="message"
        ></div>


      </form>

    </section>



    <!-- MANAGE PAGES -->

    <section class="panel">

      <h2>
        Manage Pages
      </h2>


      <div id="pageList">

        <div class="loading">
          Loading pages...
        </div>

      </div>

    </section>


  </main>



  <!-- SUPABASE -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <script>

    /* =====================================
       SUPABASE CONNECTION
    ===================================== */

    const SUPABASE_URL =
      "https://clyqhkpvhqeukgblklbu.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_MRdyQEcrzKMaeFnHJ5gKMg_4c8EGRAY";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let pages = [];


    /* =====================================
       GET TOKEN
    ===================================== */

    function getToken() {

      return sessionStorage.getItem(
        "portfolio_admin_token"
      );

    }



    /* =====================================
       LOGIN / SESSION CHECK
    ===================================== */

    async function checkLogin() {

      const token =
        getToken();


      if (!token) {

        goToLogin();

        return false;

      }


      try {

        const { data, error } =
          await supabaseClient.rpc(
            "check_admin_session",
            {
              p_token: token
            }
          );


        if (
          error ||
          !data ||
          data.valid !== true
        ) {

          clearSession();

          goToLogin();

          return false;

        }


        document
          .getElementById(
            "currentUser"
          )
          .textContent =
          "Logged in: " +
          data.username;


        return true;

      }

      catch (error) {

        console.error(error);

        clearSession();

        goToLogin();

        return false;

      }

    }



    /* =====================================
       LOAD ALL PAGES
    ===================================== */

    async function loadPages() {

      const token =
        getToken();


      const pageList =
        document.getElementById(
          "pageList"
        );


      pageList.innerHTML =
        '<div class="loading">Loading pages...</div>';


      try {

        const { data, error } =
          await supabaseClient.rpc(
            "admin_get_pages",
            {
              p_token: token
            }
          );


        if (error) {

          console.error(error);


          if (
            error.message
              .toLowerCase()
              .includes("session")
          ) {

            clearSession();
            goToLogin();

            return;
          }


          pageList.innerHTML =
            '<div class="empty">Unable to load pages.</div>';

          return;

        }


        pages =
          data || [];


        renderPages();


        if (
          !document
            .getElementById("editId")
            .value
        ) {

          setNextMenuOrder();

        }

      }

      catch (error) {

        console.error(error);

        pageList.innerHTML =
          '<div class="empty">Unable to load pages.</div>';

      }

    }



    /* =====================================
       RENDER PAGE LIST
    ===================================== */

    function renderPages() {

      const pageList =
        document.getElementById(
          "pageList"
        );


      pageList.innerHTML = "";


      if (
        !pages ||
        pages.length === 0
      ) {

        pageList.innerHTML =
          '<div class="empty">No pages found.</div>';

        return;

      }


      pages.forEach(page => {


        const item =
          document.createElement(
            "div"
          );


        item.className =
          "page-item";



        /* PAGE INFO */

        const info =
          document.createElement(
            "div"
          );


        info.className =
          "page-info";



        const heading =
          document.createElement(
            "h3"
          );


        heading.textContent =
          page.title;



        const slug =
          document.createElement(
            "div"
          );


        slug.className =
          "slug";


        slug.textContent =
          "/" + page.slug;



        const preview =
          document.createElement(
            "div"
          );


        preview.className =
          "preview";


        const shortContent =
          page.content || "";


        preview.textContent =
          shortContent.length > 120
            ? shortContent.substring(
                0,
                120
              ) + "..."
            : shortContent;



        const badges =
          document.createElement(
            "div"
          );


        badges.className =
          "badges";


        badges.appendChild(
          createBadge(
            page.visible
              ? "Visible"
              : "Hidden",
            page.visible
              ? ""
              : "hidden"
          )
        );


        badges.appendChild(
          createBadge(
            page.show_in_menu
              ? "In Menu"
              : "Not in Menu"
          )
        );


        badges.appendChild(
          createBadge(
            "Order: " +
            page.menu_order
          )
        );


        if (page.is_home) {

          badges.appendChild(
            createBadge(
              "Home",
              "home"
            )
          );

        }


        info.appendChild(
          heading
        );

        info.appendChild(
          slug
        );

        info.appendChild(
          preview
        );

        info.appendChild(
          badges
        );



        /* ACTION BUTTONS */

        const actions =
          document.createElement(
            "div"
          );


        actions.className =
          "actions";



        actions.appendChild(
          createButton(
            "Edit",
            "edit-btn",
            function() {
              editPage(page.id);
            }
          )
        );



        actions.appendChild(
          createButton(
            page.visible
              ? "Hide"
              : "Show",

            "visibility-btn",

            function() {
              toggleVisibility(
                page.id
              );
            }
          )
        );



        actions.appendChild(
          createButton(
            page.show_in_menu
              ? "Remove Menu"
              : "Add Menu",

            "menu-btn",

            function() {
              toggleMenu(
                page.id
              );
            }
          )
        );



        if (!page.is_home) {

          actions.appendChild(
            createButton(
              "Delete",
              "delete-btn",

              function() {
                deletePage(page);
              }
            )
          );

        }



        item.appendChild(
          info
        );


        item.appendChild(
          actions
        );


        pageList.appendChild(
          item
        );

      });

    }



    /* =====================================
       CREATE BADGE
    ===================================== */

    function createBadge(
      text,
      extraClass = ""
    ) {

      const badge =
        document.createElement(
          "span"
        );


      badge.className =
        "badge " +
        extraClass;


      badge.textContent =
        text;


      return badge;

    }



    /* =====================================
       CREATE BUTTON
    ===================================== */

    function createButton(
      text,
      className,
      callback
    ) {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.textContent =
        text;


      button.className =
        className;


      button.onclick =
        callback;


      return button;

    }



    /* =====================================
       SAVE / UPDATE PAGE
    ===================================== */

    document
      .getElementById(
        "pageForm"
      )
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const token =
            getToken();


          if (!token) {

            goToLogin();

            return;

          }



          const editId =
            document
              .getElementById(
                "editId"
              )
              .value;



          const title =
            document
              .getElementById(
                "title"
              )
              .value
              .trim();



          const slug =
            document
              .getElementById(
                "slug"
              )
              .value
              .trim();



          const content =
            document
              .getElementById(
                "content"
              )
              .value;



          const menuOrder =
            Number(
              document
                .getElementById(
                  "menuOrder"
                )
                .value
            );



          const visible =
            document
              .getElementById(
                "visible"
              )
              .checked;



          const showInMenu =
            document
              .getElementById(
                "showInMenu"
              )
              .checked;



          const saveButton =
            document.getElementById(
              "saveButton"
            );


          saveButton.disabled =
            true;


          saveButton.textContent =
            "Saving...";


          try {


            const { data, error } =
              await supabaseClient.rpc(
                "admin_save_page",
                {

                  p_token:
                    token,

                  p_id:
                    editId || null,

                  p_title:
                    title,

                  p_slug:
                    slug,

                  p_content:
                    content,

                  p_visible:
                    visible,

                  p_show_in_menu:
                    showInMenu,

                  p_menu_order:
                    menuOrder

                }
              );



            if (error) {

              console.error(error);


              if (
                error.message
                  .toLowerCase()
                  .includes(
                    "session"
                  )
              ) {

                clearSession();

                goToLogin();

                return;

              }


              showMessage(
                error.message,
                "error"
              );


              return;

            }



            if (
              !data ||
              data.success !== true
            ) {

              showMessage(
                data?.message ||
                "Unable to save page.",
                "error"
              );


              return;

            }



            showMessage(
              data.message ||
              "Page saved successfully.",
              "success"
            );


            resetForm();


            await loadPages();


          }

          catch (error) {

            console.error(error);


            showMessage(
              "Unable to save page.",
              "error"
            );

          }

          finally {

            saveButton.disabled =
              false;


            saveButton.textContent =
              "Save Page";

          }

        }
      );



    /* =====================================
       EDIT PAGE
    ===================================== */

    function editPage(id) {

      const page =
        pages.find(
          item =>
            item.id === id
        );


      if (!page) {
        return;
      }


      document
        .getElementById(
          "editId"
        )
        .value =
        page.id;


      document
        .getElementById(
          "title"
        )
        .value =
        page.title;


      document
        .getElementById(
          "slug"
        )
        .value =
        page.slug;


      document
        .getElementById(
          "content"
        )
        .value =
        page.content || "";


      document
        .getElementById(
          "menuOrder"
        )
        .value =
        page.menu_order;


      document
        .getElementById(
          "visible"
        )
        .checked =
        page.visible;


      document
        .getElementById(
          "showInMenu"
        )
        .checked =
        page.show_in_menu;


      document
        .getElementById(
          "formTitle"
        )
        .textContent =
        "Edit Page";


      document
        .getElementById(
          "cancelButton"
        )
        .style.display =
        "block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }



    /* =====================================
       TOGGLE VISIBILITY
    ===================================== */

    async function toggleVisibility(
      id
    ) {

      const token =
        getToken();


      try {

        const { data, error } =
          await supabaseClient.rpc(
            "admin_toggle_visibility",
            {
              p_token: token,
              p_id: id
            }
          );


        if (error) {

          handleRpcError(error);

          return;

        }


        if (
          data &&
          data.success === false
        ) {

          showMessage(
            data.message,
            "error"
          );

          return;

        }


        await loadPages();

      }

      catch (error) {

        console.error(error);

      }

    }



    /* =====================================
       TOGGLE MENU
    ===================================== */

    async function toggleMenu(
      id
    ) {

      const token =
        getToken();


      try {

        const { data, error } =
          await supabaseClient.rpc(
            "admin_toggle_menu",
            {
              p_token: token,
              p_id: id
            }
          );


        if (error) {

          handleRpcError(error);

          return;

        }


        if (
          data &&
          data.success === false
        ) {

          showMessage(
            data.message,
            "error"
          );

          return;

        }


        await loadPages();

      }

      catch (error) {

        console.error(error);

      }

    }



    /* =====================================
       DELETE PAGE
    ===================================== */

    async function deletePage(
      page
    ) {

      if (page.is_home) {

        alert(
          "Home page cannot be deleted."
        );

        return;

      }


      const confirmed =
        confirm(
          'Delete "' +
          page.title +
          '"?'
        );


      if (!confirmed) {
        return;
      }


      const token =
        getToken();


      try {

        const { data, error } =
          await supabaseClient.rpc(
            "admin_delete_page",
            {

              p_token:
                token,

              p_id:
                page.id

            }
          );


        if (error) {

          handleRpcError(error);

          return;

        }


        if (
          !data ||
          data.success !== true
        ) {

          showMessage(
            data?.message ||
            "Unable to delete page.",
            "error"
          );

          return;

        }


        showMessage(
          data.message,
          "success"
        );


        await loadPages();

      }

      catch (error) {

        console.error(error);

      }

    }



    /* =====================================
       RESET FORM
    ===================================== */

    function resetForm() {

      document
        .getElementById(
          "pageForm"
        )
        .reset();


      document
        .getElementById(
          "editId"
        )
        .value = "";


      document
        .getElementById(
          "formTitle"
        )
        .textContent =
        "Add New Page";


      document
        .getElementById(
          "visible"
        )
        .checked =
        true;


      document
        .getElementById(
          "showInMenu"
        )
        .checked =
        true;


      document
        .getElementById(
          "cancelButton"
        )
        .style.display =
        "none";


      setNextMenuOrder();

    }



    /* =====================================
       NEXT MENU ORDER
    ===================================== */

    function setNextMenuOrder() {

      let highestOrder = 0;


      pages.forEach(page => {

        const order =
          Number(
            page.menu_order
          ) || 0;


        if (
          order >
          highestOrder
        ) {

          highestOrder =
            order;

        }

      });


      document
        .getElementById(
          "menuOrder"
        )
        .value =
        highestOrder + 1;

    }



    /* =====================================
       MESSAGE
    ===================================== */

    function showMessage(
      text,
      type
    ) {

      const message =
        document.getElementById(
          "message"
        );


      message.textContent =
        text;


      message.className =
        "message " +
        type;


      setTimeout(
        function() {

          message.className =
            "message";

        },
        5000
      );

    }



    /* =====================================
       RPC ERROR
    ===================================== */

    function handleRpcError(
      error
    ) {

      console.error(error);


      const errorText =
        (
          error.message || ""
        ).toLowerCase();


      if (
        errorText.includes(
          "session"
        )
      ) {

        clearSession();

        goToLogin();

        return;

      }


      showMessage(
        error.message ||
        "Something went wrong.",
        "error"
      );

    }



    /* =====================================
       LOGOUT
    ===================================== */

    async function logout() {

      const token =
        getToken();


      try {

        if (token) {

          await supabaseClient.rpc(
            "admin_logout",
            {
              p_token: token
            }
          );

        }

      }

      catch (error) {

        console.error(error);

      }


      clearSession();


      window.location.href =
        "index.html";

    }



    /* =====================================
       CLEAR SESSION
    ===================================== */

    function clearSession() {

      sessionStorage.removeItem(
        "portfolio_admin_token"
      );


      sessionStorage.removeItem(
        "portfolio_admin_username"
      );


      sessionStorage.removeItem(
        "portfolio_admin_role"
      );

    }



    /* =====================================
       LOGIN PAGE
    ===================================== */

    function goToLogin() {

      window.location.href =
        "index.html";

    }



    /* =====================================
       START DASHBOARD
    ===================================== */

    async function startDashboard() {

      const valid =
        await checkLogin();


      if (!valid) {
        return;
      }


      await loadPages();

    }


    startDashboard();

  </script>


</body>
</html>
