<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fatema Nusrat Jahan | Admin</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background: linear-gradient(
        160deg,
        #183d64 0%,
        #005e74 48%,
        #008a94 100%
      );
      color: white;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 60px 25px 35px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .portfolio-of {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 7px;
    }

    .name {
      font-family: Georgia, serif;
      font-size: 58px;
      font-weight: 400;
      margin-top: 4px;
    }

    .pink-line {
      width: 155px;
      height: 7px;
      background: #ff6c7d;
      border-radius: 10px;
      margin: 35px 0;
    }

    .portal {
      display: flex;
      align-items: center;
      gap: 25px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 8px;
      margin-bottom: 40px;
    }

    .portal::after {
      content: "";
      width: 150px;
      height: 2px;
      background: rgba(255, 255, 255, 0.5);
    }

    .login-card {
      position: relative;
      background: white;
      color: #153b61;
      border-radius: 10px;
      padding: 55px 48px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 12px;
      height: 50%;
      background: #ff6c7d;
    }

    .login-card::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 12px;
      height: 50%;
      background: #11b5be;
    }

    .login-card h1 {
      font-size: 46px;
      margin-bottom: 18px;
    }

    .description {
      color: #68768a;
      font-size: 22px;
      margin-bottom: 45px;
    }

    .field {
      margin-bottom: 25px;
    }

    .field label {
      display: block;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .input-box {
      position: relative;
    }

    .icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 23px;
    }

    input {
      width: 100%;
      padding: 20px 20px 20px 65px;
      font-size: 20px;
      background: #fafbfc;
      border: 2px solid #d5dce5;
      border-radius: 6px;
      outline: none;
    }

    input:focus {
      border-color: #08728a;
    }

    .login-button {
      width: 100%;
      padding: 20px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #056b86;
      color: white;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-button:hover {
      background: #045b72;
    }

    .security {
      margin-top: 55px;
      padding-top: 30px;
      border-top: 1px solid #d6dce3;
      text-align: center;
      color: #6c7887;
      font-size: 17px;
      line-height: 1.7;
    }

    footer {
      margin-top: 35px;
      text-align: center;
      font-size: 17px;
      letter-spacing: 2px;
      line-height: 1.8;
    }

    footer strong {
      letter-spacing: 3px;
    }

    @media (max-width: 700px) {
      .page {
        padding: 35px 18px;
      }

      .portfolio-of {
        font-size: 17px;
        letter-spacing: 5px;
      }

      .name {
        font-size: 40px;
      }

      .portal {
        font-size: 17px;
        letter-spacing: 5px;
      }

      .login-card {
        padding: 38px 25px;
      }

      .login-card h1 {
        font-size: 34px;
      }

      .description {
        font-size: 18px;
      }

      input {
        font-size: 17px;
      }

      .login-button {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="container">

      <div class="portfolio-of">
        PORTFOLIO OF
      </div>

      <div class="name">
        Fatema Nusrat Jahan
      </div>

      <div class="pink-line"></div>

      <div class="portal">
        ADMIN PORTAL
      </div>

      <div class="login-card">
        <h1>Admin Login</h1>

        <div class="description">
          Please sign in to continue
        </div>

        <form id="loginForm">

          <div class="field">
            <label for="userId">User ID</label>

            <div class="input-box">
              <span class="icon">✉</span>

              <input
                type="text"
                id="userId"
                placeholder="Enter your User ID"
                required
              />
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>

            <div class="input-box">
              <span class="icon">●</span>

              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
              />
            </div>
          </div>

          <button type="submit" class="login-button">
            Log In →
          </button>

        </form>

        <div class="security">
          Secure admin access · direct/reloaded links require login again ·
          automatic logout after 10 minutes of inactivity.
        </div>
      </div>

      <footer>
        © 2026 Fatema Nusrat Jahan
        <br />
        <strong>PORTFOLIO</strong>
      </footer>

    </div>
  </div>

 <script>
  document
    .getElementById("loginForm")
    .addEventListener("submit", function (event) {

      event.preventDefault();

      const userId =
        document.getElementById("userId").value.trim();

      const password =
        document.getElementById("password").value;

      /* TEMPORARY TEST LOGIN */

      if (
        userId === "admin" &&
        password === "1234"
      ) {
        window.location.href = "dashboard.html";
      } else {
        alert("Invalid User ID or Password");
      }

    });
</script>
</body>
</html>
