<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Admin Login | Fatema Nusrat Jahan
  </title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #173e64,
          #007f89
        );

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;

    }


    .login-wrapper {

      width: 100%;
      max-width: 440px;

    }


    .brand {

      text-align: center;
      color: white;

      margin-bottom: 28px;

    }


    .small-title {

      font-size: 14px;

      letter-spacing: 5px;

      font-weight: bold;

      margin-bottom: 12px;

    }


    .brand h1 {

      font-family:
        Georgia,
        serif;

      font-size: 38px;

      font-weight: normal;

      line-height: 1.15;

    }


    .pink-line {

      width: 100px;
      height: 5px;

      background: #ff7183;

      border-radius: 20px;

      margin:
        18px auto;

    }


    .portal-title {

      font-size: 14px;

      letter-spacing: 4px;

      font-weight: bold;

    }


    .login-card {

      background: white;

      border-radius: 15px;

      padding: 35px;

      box-shadow:
        0 25px 60px
        rgba(0,0,0,.20);

    }


    .login-card h2 {

      text-align: center;

      font-family:
        Georgia,
        serif;

      color: #075c73;

      font-size: 28px;

      margin-bottom: 28px;

    }


    label {

      display: block;

      margin-top: 15px;
      margin-bottom: 7px;

      font-weight: bold;

      color: #31495a;

    }


    input {

      width: 100%;

      padding: 13px 14px;

      border:
        1px solid #ccd6dd;

      border-radius: 7px;

      font-size: 16px;

      outline: none;

    }


    input:focus {

      border-color: #078098;

      box-shadow:
        0 0 0 3px
        rgba(0,128,152,.10);

    }


    button {

      width: 100%;

      border: none;

      margin-top: 25px;

      padding: 14px;

      border-radius: 7px;

      background:
        linear-gradient(
          135deg,
          #075c73,
          #008894
        );

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    button:hover {

      opacity: .94;

    }


    button:disabled {

      opacity: .65;

      cursor: not-allowed;

    }


    .message {

      display: none;

      margin-top: 18px;

      padding: 12px;

      border-radius: 7px;

      text-align: center;

      font-size: 14px;

    }


    .error {

      display: block;

      background: #ffe7e9;

      color: #9d2b39;

    }


    .success {

      display: block;

      background: #e6f7ee;

      color: #17633b;

    }


    .footer {

      text-align: center;

      margin-top: 22px;

      color:
        rgba(255,255,255,.8);

      font-size: 13px;

    }


    @media(max-width: 500px) {

      .brand h1 {

        font-size: 31px;

      }


      .login-card {

        padding: 27px 22px;

      }

    }

  </style>
</head>


<body>


  <div class="login-wrapper">


    <div class="brand">

      <div class="small-title">
        PORTFOLIO OF
      </div>

      <h1>
        Fatema Nusrat Jahan
      </h1>

      <div class="pink-line"></div>

      <div class="portal-title">
        ADMIN PORTAL
      </div>

    </div>



    <div class="login-card">

      <h2>
        Admin Login
      </h2>


      <form id="loginForm">


        <label for="userId">
          User ID
        </label>

        <input
          type="text"
          id="userId"
          autocomplete="username"
          placeholder="Enter User ID"
          required
        >



        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          autocomplete="current-password"
          placeholder="Enter Password"
          required
        >



        <button
          type="submit"
          id="loginButton"
        >
          Log In
        </button>



        <div
          id="message"
          class="message"
        ></div>


      </form>

    </div>



    <div class="footer">
      © 2026 Fatema Nusrat Jahan
    </div>


  </div>



  <!-- SUPABASE -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <script>

    const SUPABASE_URL =
      "https://clyqhkpvhqeukgblklbu.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_MRdyQEcrzKMaeFnHJ5gKMg_4c8EGRAY";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    /* ==========================
       CHECK EXISTING SESSION
    ========================== */

    async function checkExistingSession() {

      const token =
        sessionStorage.getItem(
          "portfolio_admin_token"
        );


      if (!token) {
        return;
      }


      try {

        const { data, error } =
          await supabaseClient.rpc(
            "check_admin_session",
            {
              p_token: token
            }
          );


        if (
          !error &&
          data &&
          data.valid === true
        ) {

          window.location.href =
            "dashboard.html";

        } else {

          sessionStorage.removeItem(
            "portfolio_admin_token"
          );

          sessionStorage.removeItem(
            "portfolio_admin_username"
          );

          sessionStorage.removeItem(
            "portfolio_admin_role"
          );

        }

      }

      catch (error) {

        console.error(error);

      }

    }



    /* ==========================
       LOGIN
    ========================== */

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const username =
            document
              .getElementById("userId")
              .value
              .trim()
              .toLowerCase();


          const password =
            document
              .getElementById("password")
              .value;


          const button =
            document.getElementById(
              "loginButton"
            );


          const message =
            document.getElementById(
              "message"
            );


          message.className =
            "message";

          message.style.display =
            "none";


          if (
            !username ||
            !password
          ) {

            showMessage(
              "Please enter User ID and Password.",
              "error"
            );

            return;

          }


          button.disabled = true;

          button.textContent =
            "Logging in...";


          try {


            const { data, error } =
              await supabaseClient.rpc(
                "admin_login",
                {
                  p_username:
                    username,

                  p_password:
                    password
                }
              );



            if (error) {

              console.error(error);

              showMessage(
                "Login failed. Please try again.",
                "error"
              );

              return;

            }



            if (
              !data ||
              data.success !== true
            ) {

              showMessage(
                data?.message ||
                "Invalid User ID or Password",
                "error"
              );

              return;

            }



            /* SAVE SESSION TOKEN */

            sessionStorage.setItem(
              "portfolio_admin_token",
              data.token
            );


            sessionStorage.setItem(
              "portfolio_admin_username",
              data.username
            );


            sessionStorage.setItem(
              "portfolio_admin_role",
              data.role
            );



            showMessage(
              "Login successful.",
              "success"
            );



            setTimeout(
              function() {

                window.location.href =
                  "dashboard.html";

              },
              400
            );


          }

          catch (error) {

            console.error(error);

            showMessage(
              "Unable to connect to the database.",
              "error"
            );

          }

          finally {

            button.disabled = false;

            button.textContent =
              "Log In";

          }

        }
      );



    /* ==========================
       MESSAGE
    ========================== */

    function showMessage(
      text,
      type
    ) {

      const message =
        document.getElementById(
          "message"
        );


      message.textContent =
        text;


      message.className =
        "message " + type;

    }



    /* START */

    checkExistingSession();


  </script>


</body>
</html>
